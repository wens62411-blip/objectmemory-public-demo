[platformio]
default_envs = esp32cam

[env:esp32cam]
platform = espressif32 @ 7.0.1
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = min_spiffs.csv
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINOJSON_DECODE_UNICODE=1
    -DOM_BOARD_AI_THINKER_ESP32CAM=1
lib_deps =
    bblanchon/ArduinoJson @ 7.4.3

[env:seeed_xiao_esp32s3]
platform = espressif32 @ 7.0.1
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = partitions-xiao-esp32s3-sense.csv
; The fixed PIO board selects 8 MB QIO flash + 8 MB OPI PSRAM and native USB CDC.
board_build.arduino.memory_type = qio_opi
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINOJSON_DECODE_UNICODE=1
    -DOM_BOARD_XIAO_ESP32S3_SENSE=1
lib_deps =
    bblanchon/ArduinoJson @ 7.4.3
